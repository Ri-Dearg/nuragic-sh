<fieldset {% if fieldset.css_id %}id="{{ fieldset.css_id }}"{% endif %}
          {% if fieldset.css_class %}class="{{ fieldset.css_class }}"{% endif %}
          {{ fieldset.flat_attrs }}>
    {% if legend %}<legend class="h-font l-space-1 h3 text-primary mb-3">{{ legend|safe }}</legend>{% endif %}
    {{ fields|safe }}
</fieldset>
